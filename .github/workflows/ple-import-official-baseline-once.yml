name: Official unchanged PLE starter baseline (one-time zero-cost)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ple-import-official-baseline-once.yml'
permissions:
  contents: write
jobs:
  import-verbatim:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: ${{ github.repository == 'samertall/ple-aegis-harness' && github.event_name == 'push' }}
    steps:
      - name: Checkout original Aegis main (never overwrite)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Restrict to free temporary GitHub infrastructure
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_ENVIRONMENT" == "github-hosted" ]] || exit 2
          [[ "$GITHUB_REPOSITORY" == "samertall/ple-aegis-harness" ]] || exit 2
          [[ "$GITHUB_REF_NAME" == "main" ]] || exit 2
          if git ls-remote --exit-code --heads origin refs/heads/official-template-baseline >/dev/null; then
            echo "::error::Baseline already exists; will not overwrite."
            exit 2
          fi
      - name: Fetch published, unmodified, Apache-2.0 starter with 29 genuine dev artifacts
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone --depth 1 https://github.com/physical-engineerings-last-exam/submission-template.git "$RUNNER_TEMP/official-template"
          test "$(git -C "$RUNNER_TEMP/official-template" rev-parse HEAD)" = "22c26a93a9e4974b16e4351faab0e860ff9fb24f" || {
            echo "::error::Upstream starter commit changed; stop rather than import a modified version."
            exit 2
          }
          test -f "$RUNNER_TEMP/official-template/artifacts/manifest.json"
          test -f "$RUNNER_TEMP/official-template/LICENSE"
          test -f "$RUNNER_TEMP/official-template/submission.yaml"
          grep -q '^model_api: google-cloud/claude-opus-5-5$' "$RUNNER_TEMP/official-template/submission.yaml"
          echo "Verified official unchanged starter SHA and sponsored Claude model."
      - name: Official kit validate and offline artifact provenance review (NO model calls)
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone --depth 1 https://github.com/google-research/ple.git "$RUNNER_TEMP/ple"
          cd "$RUNNER_TEMP/ple"
          uv run python -m kit validate "$RUNNER_TEMP/official-template"
          uv run python -m kit artifacts "$RUNNER_TEMP/official-template" | tee "$RUNNER_TEMP/offline-artifacts-review.txt"
          echo "Kit accepted official starter artifacts without executing an inference or accessing gated dev data."
      - name: Push EXACT source commit unchanged to an isolated branch
        shell: bash
        run: |
          set -Eeuo pipefail
          # Keep all blobs, all 29 task artifact folders, exact commit SHA and
          # README/license unchanged. Aegis main branch is untouched.
          git fetch --no-tags --depth=1 https://github.com/physical-engineerings-last-exam/submission-template.git 22c26a93a9e4974b16e4351faab0e860ff9fb24f
          test "$(git rev-parse FETCH_HEAD)" = "22c26a93a9e4974b16e4351faab0e860ff9fb24f"
          git push origin "22c26a93a9e4974b16e4351faab0e860ff9fb24f:refs/heads/official-template-baseline"
          test "$(git ls-remote origin refs/heads/official-template-baseline | cut -f1)" = "22c26a93a9e4974b16e4351faab0e860ff9fb24f"
          echo "Pushed identical official template SHA to official-template-baseline; Aegis main unchanged."
      - name: Report provenance and limitations accurately
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Official template baseline prepared
          - Branch: `official-template-baseline`
          - Upstream: https://github.com/physical-engineerings-last-exam/submission-template
          - Exact original upstream SHA: `22c26a93a9e4974b16e4351faab0e860ff9fb24f`
          - Contains the official template's original Pi/Claude Opus 5.5 code and genuine dev artifacts, **not Aegis results**.
          - No model inference, user local disk, paid cloud, gated task download, or billing used.
          - The Aegis `main` branch is unchanged.
          - Kaggle / competition portal submission remains a **separate action**, not performed by this workflow.
          EOF
