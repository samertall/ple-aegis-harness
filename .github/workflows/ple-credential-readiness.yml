name: PLE credential readiness (non-billable)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  credentials:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check whether access variables are configured (do not expose values)
        shell: bash
        env:
          CHECK_HF: ${{ secrets.PLE_HF_TOKEN }}
          CHECK_PROXY_URL: ${{ secrets.PLE_MODEL_PROXY_URL }}
          CHECK_PROXY_KEY: ${{ secrets.PLE_MODEL_PROXY_KEY }}
        run: |
          set -Eeuo pipefail
          echo '## PLE external-access prerequisites' >> "$GITHUB_STEP_SUMMARY"
          echo 'This checks secret presence only. It never performs model calls or authorizes charges.' >> "$GITHUB_STEP_SUMMARY"
          if [[ -z "$CHECK_HF" ]]; then
            echo '::warning::Missing PLE_HF_TOKEN; gated dev dataset unavailable for automated run.'
            echo '- [ ] Hugging Face read token stored as Actions secret' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '- [x] Hugging Face token variable configured (dataset approval unverified)' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -z "$CHECK_PROXY_URL" || -z "$CHECK_PROXY_KEY" ]]; then
            echo '::warning::Missing authorized model proxy URL and/or key.'
            echo '- [ ] Model proxy endpoint and key stored as Actions secrets' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '- [x] Model proxy URL/key variables configured (connectivity unverified)' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '- [ ] Dedicated self-hosted Linux runner labelled ple, with Docker and sufficient resources' >> "$GITHUB_STEP_SUMMARY"
          echo '- [ ] Explicit approve-spend selection for manual evaluation workflow' >> "$GITHUB_STEP_SUMMARY"
          echo 'No real PLE task, evaluator, or model was run by this job.' >> "$GITHUB_STEP_SUMMARY"
