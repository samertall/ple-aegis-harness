name: Publish Aegis PLE source
on:
  push:
    paths:
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract verified source bundle
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, bz2, io, tarfile
          path = Path(".bootstrap/repository-source.b64")
          payload = bz2.decompress(base64.b64decode(path.read_text().strip(), validate=True))
          with tarfile.open(fileobj=io.BytesIO(payload), mode="r:") as archive:
              for item in archive.getmembers():
                  p = Path(item.name)
                  if (not item.isfile() or p.is_absolute()
                      or ".." in p.parts or item.issym() or item.islnk()):
                      raise ValueError(f"Disallowed archive member: {item.name}")
                  if p.as_posix() == '.github/workflows/ci.yml':
                      continue
                  p.parent.mkdir(parents=True, exist_ok=True)
                  with archive.extractfile(item) as src:
                      p.write_bytes(src.read())
          PY
      - name: Remove transport and commit source
        run: |
          rm -rf .bootstrap
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Publish full Aegis PLE source scaffold (unscored)'
            git push origin HEAD:main
          fi
