name: Free PLE OFFLINE protocol simulator
on:
  push:
    branches: [main]
    paths:
      - 'harness.py'
      - 'serve.py'
      - 'protocol.py'
      - 'mcp_bridge.py'
      - 'scripts/mock_model_proxy.py'
      - 'tests/test_offline_model_proxy.py'
      - '.github/workflows/ple-free-protocol-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODEL_PROXY_URL: http://127.0.0.1:48711
      MODEL_PROXY_KEY: local-offline-protocol-test-only
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Test offline fixture without any real-model calls
        run: |
          uv run --no-project --with pytest python -m pytest -q tests/test_offline_model_proxy.py
      - name: Start local deterministic mock model (never contacts external APIs)
        run: |
          python scripts/mock_model_proxy.py > "$RUNNER_TEMP/mock-proxy.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/mock-proxy.pid"
          python - <<'PY'
          import socket,time
          for _ in range(40):
              try:
                  with socket.create_connection(('127.0.0.1',48711),timeout=1):
                      break
              except OSError:
                  time.sleep(0.25)
          else:
              raise RuntimeError('OFFLINE mock proxy did not listen')
          PY
      - name: Run official kit protocol stages against OFFLINE fake model
        run: |
          set -Eeuo pipefail
          git clone --depth 1 https://github.com/google-research/ple.git "$RUNNER_TEMP/ple"
          cd "$RUNNER_TEMP/ple"
          set +e
          uv run python -m kit check "$GITHUB_WORKSPACE" --work "$RUNNER_TEMP/ple-check" > "$RUNNER_TEMP/kit-check.log" 2>&1
          kit_rc=$?
          set -e
          grep -E '^\[(PASS|WARN|FAIL|skip)\]' "$RUNNER_TEMP/kit-check.log" || true
          python - <<'PY'
          import json,os,pathlib,sys
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'ple-check'/'check.json'
          if not path.exists():
              print('::error::Official kit did not produce a report')
              raise SystemExit(1)
          report=json.loads(path.read_text())
          stages={s['name']:s['status'] for s in report['stages']}
          expected=['submission.yaml','files','build','model','listen','smoke','mcp']
          bad=[n for n in expected if stages.get(n)!='pass']
          if bad:
              print('::error::Offline PLE protocol stages not passing: '+', '.join(bad))
              sys.exit(1)
          print('Official PLE kit smoke/MCP stages PASS with OFFLINE fake model only.')
          print('No real AI model, dev task, grader or engineering artifact was tested.')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('### OFFLINE PLE protocol check only\n')
              f.write('Model interface, WebSocket, hello.txt smoke, MCP stages passed with deterministic FAKE model.\n')
              f.write('No real AI, dev task, grading, artifacts, or submission qualification was performed.\n')
          PY
      - name: Store checker report (no secrets or benchmark content)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-ple-protocol-report
          path: |
            ${{ runner.temp }}/ple-check/check.json
            ${{ runner.temp }}/kit-check.log
          if-no-files-found: ignore
          retention-days: 7
