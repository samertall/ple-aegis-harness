name: Gemini key metadata check (NO inference, NO billing)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/check_gemini_metadata.py'
      - 'tests/test_gemini_metadata.py'
      - '.github/workflows/ple-gemini-key-metadata.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Unit-test key-safe metadata request with fake transport (offline)
        run: |
          python -m pip -q install pytest
          python -m pytest -q tests/test_gemini_metadata.py
      - name: Inspect whether secret is configured (never print value)
        id: configured
        env:
          GEMINI_API_KEY: ${{ secrets.PLE_GEMINI_API_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -n "$GEMINI_API_KEY" ]]; then
            echo "present=yes" >> "$GITHUB_OUTPUT"
          else
            echo "present=no" >> "$GITHUB_OUTPUT"
            echo "::warning::PLE_GEMINI_API_KEY is absent. Skipping authenticated model metadata lookup."
          fi
      - name: Authenticate against model metadata ONLY — no prompts or generation
        if: steps.configured.outputs.present == 'yes'
        env:
          GEMINI_API_KEY: ${{ secrets.PLE_GEMINI_API_KEY }}
        run: |
          python scripts/check_gemini_metadata.py
      - name: Record boundaries of this check
        if: always()
        shell: bash
        run: |
          echo "### Free-only Gemini key metadata preflight" >> "$GITHUB_STEP_SUMMARY"
          echo "- Only \`GET /v1beta/models/gemini-3.8-flash\` (if secret is configured)" >> "$GITHUB_STEP_SUMMARY"
          echo "- No \`generateContent\`, chat, MCP, PLE task materials or judge calls" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Does not verify project billing tier**; confirm Free Tier separately in Google AI Studio" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Does not qualify Aegis PLE** or create dev artifacts" >> "$GITHUB_STEP_SUMMARY"
